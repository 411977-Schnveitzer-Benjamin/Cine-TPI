<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera - Cine TPI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar scrolled">
        <div class="container navbar-container">
            <a href="index.html" class="logo">
                <span class="logo-cine">Cine</span><span class="logo-tpi">TPI</span>
            </a>
            <nav class="nav-links">
                <a href="cartelera.html" class="nav-link" style="color: var(--clr-text);">Cartelera</a>
                <a href="estrenos.html" class="nav-link">Próximos Estrenos</a>
                <a href="promociones.html" class="nav-link">Promociones</a>
            </nav>
            <div class="auth-buttons">
                <a href="index.html" class="btn btn-outline">Volver al inicio</a>
            </div>
        </div>
    </header>

    <!-- Content -->
    <div class="container" style="padding-top: 120px; min-height: 80vh;">
        <h1 class="hero-title" style="font-size: 3.5rem; margin-bottom: 0.5rem;">Nuestra Cartelera</h1>
        <p class="hero-subtitle">Descubrí las mejores películas actualmente en nuestras salas.</p>
        
        <!-- Contenedor vacío donde luego JS inyectará las películas -->
        <div id="peliculas-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem; margin-top: 3rem;">
            <!-- Placeholder para ver cómo queda -->
            <div style="background: var(--clr-surface); border: 1px solid var(--clr-border); border-radius: 12px; height: 350px; display: flex; align-items: center; justify-content: center; color: var(--clr-text-muted);">Película 1</div>
            <div style="background: var(--clr-surface); border: 1px solid var(--clr-border); border-radius: 12px; height: 350px; display: flex; align-items: center; justify-content: center; color: var(--clr-text-muted);">Película 2</div>
            <div style="background: var(--clr-surface); border: 1px solid var(--clr-border); border-radius: 12px; height: 350px; display: flex; align-items: center; justify-content: center; color: var(--clr-text-muted);">Película 3</div>
        </div>
    </div>
</body>
</html>

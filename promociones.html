<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promociones - Cine TPI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar scrolled">
        <div class="container navbar-container">
            <a href="index.html" class="logo">
                <span class="logo-cine">Cine</span><span class="logo-tpi">TPI</span>
            </a>
            <nav class="nav-links">
                <a href="cartelera.html" class="nav-link">Cartelera</a>
                <a href="estrenos.html" class="nav-link">Próximos Estrenos</a>
                <a href="promociones.html" class="nav-link" style="color: var(--clr-text);">Promociones</a>
            </nav>
            <div class="auth-buttons">
                <a href="index.html" class="btn btn-outline">Volver al inicio</a>
            </div>
        </div>
    </header>

    <!-- Content -->
    <div class="container" style="padding-top: 120px; min-height: 80vh;">
        <h1 class="hero-title" style="font-size: 3.5rem; margin-bottom: 0.5rem;">Promociones Exclusivas</h1>
        <p class="hero-subtitle">Conocé nuestros combos y beneficios de membresía.</p>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; margin-top: 3rem;">
            <!-- Placeholder para combos -->
            <div style="background: var(--clr-surface); border: 1px solid var(--clr-border); border-radius: 12px; padding: 2rem; text-align: center;">
                <h3 style="margin-bottom: 1rem; color: var(--clr-primary);">Combo 1</h3>
                <p style="color: var(--clr-text-muted);">2 Entradas + 1 Pochoclo Grande</p>
            </div>
            <div style="background: var(--clr-surface); border: 1px solid var(--clr-border); border-radius: 12px; padding: 2rem; text-align: center;">
                <h3 style="margin-bottom: 1rem; color: var(--clr-primary);">Combo 2</h3>
                <p style="color: var(--clr-text-muted);">1 Entrada + 1 Gaseosa + 1 Nachos</p>
            </div>
        </div>
    </div>
</body>
</html>

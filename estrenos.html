<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximos Estrenos - Cines Hollywood</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar scrolled">
        <div class="container navbar-container">
            <a href="index.html" class="logo" style="display: flex; align-items: center;">
                <img src="img/logo.png" alt="Cines Hollywood" class="site-logo">
            </a>
            <nav class="nav-links">
                <a href="cartelera.html" class="nav-link">Cartelera</a>
                <a href="estrenos.html" class="nav-link" style="color: var(--clr-text);">Próximos Estrenos</a>
                <a href="promociones.html" class="nav-link">Promociones</a>
                <a href="admin.html" class="nav-link" id="navAdminPanel" style="display: none; color: var(--clr-primary); font-weight: bold;">Panel De Administrador</a>
            </nav>
            <div class="auth-buttons">
                <a href="index.html" class="btn btn-outline">Volver al inicio</a>
            </div>
        </div>
    </header>

    <!-- Content -->
    <div class="container" style="padding-top: 120px; min-height: 80vh;">
        <h1 class="hero-title" style="font-size: 3.5rem; margin-bottom: 0.5rem;">Próximos Estrenos</h1>
        <p class="hero-subtitle">Mantenete al tanto de lo que se viene en la pantalla grande.</p>
        
        <div id="estrenos-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem; margin-top: 3rem;">
            <!-- JS inyectará aquí los próximos estrenos -->
        </div>
    </div>
    
    <script src="js/movies.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('estrenos-container');
            const movies = getMovies().filter(m => m.status === 'Próximamente');
            
            if(movies.length === 0) {
                container.innerHTML = '<p style="color: var(--clr-text-muted); text-align: center; grid-column: 1 / -1;">No hay próximos estrenos por el momento.</p>';
            } else {
                container.innerHTML = movies.map(m => createMovieCardHTML(m, true)).join('');
            }
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>

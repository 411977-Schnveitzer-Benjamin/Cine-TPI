<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine TPI - La Mejor Experiencia</title>
    <meta name="description" content="Bienvenido a Cine TPI. Disfrutá de los últimos estrenos con la mejor tecnología.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="container navbar-container">
            <a href="#" class="logo">
                <span class="logo-cine">Cine</span><span class="logo-tpi">TPI</span>
            </a>
            
            <nav class="nav-links">
                <a href="#cartelera" class="nav-link">Cartelera</a>
                <a href="#estrenos" class="nav-link">Próximos Estrenos</a>
                <a href="#promociones" class="nav-link">Promociones</a>
            </nav>

            <div class="auth-buttons">
                <button class="btn btn-outline" id="btnLogin">Iniciar Sesión</button>
                <button class="btn btn-primary" id="btnRegister">Registrarse</button>
            </div>
            
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <span class="hero-badge">Estrenos 2026</span>
            <h1 class="hero-title">Viví la mejor<br>experiencia del cine</h1>
            <p class="hero-subtitle">Disfrutá de las mejores películas en nuestras salas premium con sonido envolvente y calidad 8K.</p>
            <div class="hero-actions">
                <button class="btn btn-primary btn-lg">Ver Cartelera</button>
                <button class="btn btn-glass btn-lg">Conocer más</button>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Entradas - Cine TPI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar scrolled">
        <div class="container navbar-container">
            <a href="index.html" class="logo" style="display: flex; align-items: center;">
                <img src="img/logo.png" alt="Cines Hollywood" class="site-logo">
            </a>
            <nav class="nav-links">
                <a href="cartelera.html" class="nav-link">Cartelera</a>
                <a href="estrenos.html" class="nav-link">Próximos Estrenos</a>
                <a href="promociones.html" class="nav-link">Promociones</a>
            </nav>
            <div class="auth-buttons">
                <a href="index.html" class="btn btn-outline">Volver al inicio</a>
            </div>
        </div>
    </header>

    <div class="container" style="padding-top: 120px; padding-bottom: 80px; min-height: 80vh; max-width: 800px;">
        <h1 class="hero-title" style="font-size: 2.5rem; margin-bottom: 0.5rem; text-align: center;">Comprar Entradas</h1>
        <p class="hero-subtitle" style="text-align: center; margin-bottom: 3rem;">Inception (148 min) - +13</p>
        
        <!-- Step 1: Función -->
        <div class="card" id="step1" style="background: var(--clr-surface); border: 1px solid var(--clr-border); padding: 2rem;">
            <h2 style="margin-bottom: 1.5rem; color: var(--clr-primary);">1. Seleccioná la Función</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <select class="form-control" id="resFecha">
                    <option value="">Seleccioná el día</option>
                    <option value="hoy">Hoy</option>
                    <option value="manana">Mañana</option>
                </select>
                <select class="form-control" id="resHora">
                    <option value="">Seleccioná el horario</option>
                    <option value="1400">14:00 (2D)</option>
                    <option value="1630">16:30 (3D)</option>
                    <option value="2000">20:00 (2D)</option>
                </select>
            </div>
            <button class="btn btn-primary" style="margin-top: 1.5rem;" onclick="nextStep(2)">Continuar</button>
        </div>

        <!-- Step 2: Entradas -->
        <div class="card" id="step2" style="display: none; background: var(--clr-surface); border: 1px solid var(--clr-border); padding: 2rem; margin-top: 2rem;">
            <h2 style="margin-bottom: 1.5rem; color: var(--clr-primary);">2. Cantidad de Entradas</h2>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem; border: 1px solid var(--clr-border); border-radius: 8px; background: rgba(0,0,0,0.2);">
                <div>
                    <h3 style="margin-bottom: 0.25rem;">Entrada General</h3>
                    <span style="color: var(--clr-text-muted);">$ 4.500</span>
                </div>
                <div style="display: flex; align-items: center; gap: 1.5rem;">
                    <button class="btn btn-outline" style="padding: 0.5rem 1rem; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;" onclick="updateTickets(-1)">-</button>
                    <span id="ticketCount" style="font-size: 1.5rem; font-weight: bold; width: 20px; text-align: center;">0</span>
                    <button class="btn btn-outline" style="padding: 0.5rem 1rem; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;" onclick="updateTickets(1)">+</button>
                </div>
            </div>
            <button class="btn btn-primary" style="margin-top: 1.5rem;" onclick="nextStep(3)">Continuar a Butacas</button>
        </div>

        <!-- Step 3: Butacas -->
        <div class="card" id="step3" style="display: none; background: var(--clr-surface); border: 1px solid var(--clr-border); padding: 2rem; margin-top: 2rem;">
            <h2 style="margin-bottom: 1rem; color: var(--clr-primary);">3. Selección de Butacas</h2>
            <p style="margin-bottom: 2rem;">Tenés que seleccionar <span id="seatsToSelect" style="font-weight: bold; color: var(--clr-primary); font-size: 1.2rem;">0</span> butacas para continuar.</p>
            
            <div style="background: rgba(0,0,0,0.2); padding: 2rem; border-radius: 12px; text-align: center; overflow-x: auto; border: 1px solid var(--clr-border);">
                <div style="width: 80%; height: 15px; background: linear-gradient(to bottom, var(--clr-primary), transparent); margin: 0 auto 3rem auto; border-radius: 5px; opacity: 0.5; max-width: 600px;">PANTALLA</div>
                <div id="reserva-grid" style="display: grid; grid-template-columns: repeat(15, 1fr); gap: 8px; max-width: 700px; margin: 0 auto;">
                    <!-- JS Butacas -->
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; margin-top: 2rem; align-items: center; flex-wrap: wrap; gap: 1rem;">
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <span style="display: flex; align-items: center; gap: 0.5rem;"><div style="width: 15px; height: 15px; background: #3b82f6; border-radius: 4px;"></div> Libre</span>
                    <span style="display: flex; align-items: center; gap: 0.5rem;"><div style="width: 15px; height: 15px; background: #ef4444; border-radius: 4px;"></div> Ocupada</span>
                    <span style="display: flex; align-items: center; gap: 0.5rem;"><div style="width: 15px; height: 15px; background: #eab308; border-radius: 4px;"></div> Tu Selección</span>
                </div>
                <button class="btn btn-primary" id="btnPago" disabled onclick="alert('Redirigiendo a pasarela de pagos...')">Proceder al Pago ($<span id="totalPrice">0</span>)</button>
            </div>
        </div>

    </div>

    <script>
        let tickets = 0;
        let selectedSeats = 0;
        const TICKET_PRICE = 4500;

        function nextStep(step) {
            if(step === 2) {
                if(!document.getElementById('resFecha').value || !document.getElementById('resHora').value) {
                    alert('Por favor, seleccioná el día y el horario de la función.');
                    return;
                }
                document.getElementById('step2').style.display = 'block';
                // Scroll suave a step2
                document.getElementById('step2').scrollIntoView({ behavior: 'smooth' });
            }
            if(step === 3) {
                if(tickets <= 0) {
                    alert('Debés seleccionar al menos 1 entrada.');
                    return;
                }
                document.getElementById('step3').style.display = 'block';
                document.getElementById('step3').scrollIntoView({ behavior: 'smooth' });
                
                document.getElementById('seatsToSelect').innerText = tickets;
                document.getElementById('totalPrice').innerText = (tickets * TICKET_PRICE).toLocaleString('es-AR');
                renderSeats();
            }
        }

        function updateTickets(change) {
            if(tickets + change >= 0 && tickets + change <= 10) {
                tickets += change;
                document.getElementById('ticketCount').innerText = tickets;
                
                // Si ya estaba en el paso 3 y cambia la cantidad de entradas, hay que reiniciar las butacas
                if (document.getElementById('step3').style.display === 'block') {
                    document.getElementById('seatsToSelect').innerText = tickets;
                    document.getElementById('totalPrice').innerText = (tickets * TICKET_PRICE).toLocaleString('es-AR');
                    
                    // Si redujo la cantidad y tiene mas seleccionadas de las que deberia, limpiamos la selección
                    if (selectedSeats > tickets) {
                        alert('Redujiste la cantidad de entradas. Por favor, volvé a seleccionar tus butacas.');
                        renderSeats();
                    } else {
                        checkPagoBtn();
                    }
                }
            }
        }

        function renderSeats() {
            const grid = document.getElementById('reserva-grid');
            grid.innerHTML = '';
            selectedSeats = 0;
            checkPagoBtn();
            
            for(let i=0; i<150; i++) {
                const div = document.createElement('div');
                div.style.aspectRatio = '1';
                div.style.borderRadius = '4px';
                div.style.cursor = 'pointer';
                div.style.transition = 'all 0.2s';
                
                // 25% prob de ocupada para la demo
                const isOccupied = Math.random() > 0.75;
                
                if (isOccupied) {
                    div.style.background = '#ef4444'; // Rojo ocupado
                    div.dataset.status = 'occupied';
                    div.style.cursor = 'not-allowed';
                } else {
                    div.style.background = '#3b82f6'; // Azul libre
                    div.dataset.status = 'free';
                }
                
                div.addEventListener('click', () => {
                    if(div.dataset.status === 'occupied') return;

                    if(div.dataset.status === 'selected') {
                        // Deseleccionar
                        div.style.background = '#3b82f6';
                        div.dataset.status = 'free';
                        div.style.transform = 'scale(1)';
                        selectedSeats--;
                    } else {
                        // Seleccionar
                        if(selectedSeats < tickets) {
                            div.style.background = '#eab308'; // Amarillo seleccionado (resalta más que el azul/rojo)
                            div.dataset.status = 'selected';
                            div.style.transform = 'scale(1.1)';
                            selectedSeats++;
                        } else {
                            alert(`Ya seleccionaste tus ${tickets} butacas. Si querés cambiar de lugar, deseleccioná una primero.`);
                        }
                    }
                    checkPagoBtn();
                });
                grid.appendChild(div);
            }
        }

        function checkPagoBtn() {
            const btn = document.getElementById('btnPago');
            if (selectedSeats === tickets && tickets > 0) {
                btn.disabled = false;
            } else {
                btn.disabled = true;
            }
        }
    </script>
</body>
</html>

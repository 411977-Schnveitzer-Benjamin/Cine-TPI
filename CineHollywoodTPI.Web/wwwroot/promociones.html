<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promociones - Cines Hollywood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar scrolled">
        <div class="container navbar-container">
            <a href="index.html" class="logo">
                <span class="logo-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.5"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/></svg></span>
                <span>Cines <b>Hollywood</b></span>
            </a>
            <nav class="nav-links" aria-label="Principal">
                <a href="cartelera.html" class="nav-link">Cartelera</a>
                <a href="estrenos.html" class="nav-link">Próximos estrenos</a>
                <a href="promociones.html" class="nav-link">Promociones</a>
            </nav>
            <div class="auth-buttons" id="authArea"></div>
            <button class="btn btn-icon mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir menú">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            </button>
        </div>
    </header>

    <main class="container page">
        <div class="page-header">
            <h1 class="page-title">Promociones</h1>
            <p class="page-subtitle">Descuentos aplicados automáticamente al precio de la entrada en las funciones adheridas.</p>
        </div>

        <div class="promo-grid" id="promociones-container"></div>
    </main>

    <footer class="footer">
        <div class="container"><span>© 2026 Cines Hollywood - TPI</span></div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.14.5/sweetalert2.all.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const cont = document.getElementById('promociones-container');
            cont.innerHTML = htmlCargando();
            try {
                const [promos, funciones] = await Promise.all([
                    api('/catalogo/promociones'),
                    api('/funcion?soloProximas=true')
                ]);

                if (!promos.length) {
                    cont.innerHTML = htmlVacio('No hay promociones activas en este momento.');
                    return;
                }

                cont.innerHTML = promos.map(p => {
                    const adheridas = funciones.filter(f => f.idPromocion === p.idPromocion);
                    const lista = adheridas.length
                        ? `<div class="chips">${adheridas.slice(0, 8).map(f =>
                              `<a class="chip" href="reserva.html?id=${f.idPelicula}&funcion=${f.idFuncion}">${esc(f.peliculaTitulo)} · ${fmtFechaCorta(f.fecha)} ${fmtHora(f.horaInicio)}</a>`).join('')}</div>`
                        : '<p class="text-muted">Por ahora no hay funciones próximas con esta promo.</p>';

                    return `
                        <article class="card promo-card">
                            <span class="promo-porcentaje">-${Number(p.porcentajeDescuento ?? 0)}%</span>
                            <h2>${esc(p.descripcion)}</h2>
                            <p class="text-muted" style="margin:0">Funciones adheridas:</p>
                            ${lista}
                        </article>`;
                }).join('');
            } catch (err) {
                cont.innerHTML = htmlVacio(err.message);
            }
        });
    </script>
</body>
</html>

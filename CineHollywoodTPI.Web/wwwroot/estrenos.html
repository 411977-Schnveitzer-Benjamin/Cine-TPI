<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximos estrenos - Cines Hollywood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="navbarCine"></header>

    <main class="container page">
        <h1 class="display-5 fw-bold">Próximos estrenos</h1>
        <p class="lead text-body-secondary mb-5">Películas que todavía no tienen funciones programadas. ¡Muy pronto en nuestras salas!</p>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4" id="estrenos-container"></div>
    </main>

    <footer class="border-top py-4 text-body-secondary small">
        <div class="container">© 2026 Cines Hollywood - TPI</div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.14.5/sweetalert2.all.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const cont = document.getElementById('estrenos-container');
            cont.innerHTML = htmlCargando();
            try {
                const peliculas = await api('/pelicula/estrenos');
                cont.innerHTML = peliculas.length
                    ? peliculas.map(p => `
                        <div class="col">
                            <article class="card h-100 movie-card">
                                ${posterHTML(p, 'Próximamente')}
                                <div class="card-body">
                                    <h2 class="card-title h5">${esc(p.titulo)}</h2>
                                    <div class="d-flex align-items-center gap-2 small text-body-secondary">
                                        ${badgeClasificacion(p.clasificacionDescripcion)}
                                        <span>${p.duracionMinutos ?? '-'} min</span>
                                    </div>
                                </div>
                            </article>
                        </div>`).join('')
                    : htmlVacio('No hay próximos estrenos por el momento.');
            } catch (err) {
                cont.innerHTML = htmlVacio(err.message);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximos estrenos - Cines Hollywood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar scrolled">
        <div class="container navbar-container">
            <a href="index.html" class="logo">
                <span class="logo-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.5"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/></svg></span>
                <span>Cines <b>Hollywood</b></span>
            </a>
            <nav class="nav-links" aria-label="Principal">
                <a href="cartelera.html" class="nav-link">Cartelera</a>
                <a href="estrenos.html" class="nav-link">Próximos estrenos</a>
                <a href="promociones.html" class="nav-link">Promociones</a>
            </nav>
            <div class="auth-buttons" id="authArea"></div>
            <button class="btn btn-icon mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir menú">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            </button>
        </div>
    </header>

    <main class="container page">
        <div class="page-header">
            <h1 class="page-title">Próximos estrenos</h1>
            <p class="page-subtitle">Películas que todavía no tienen funciones programadas. ¡Muy pronto en nuestras salas!</p>
        </div>

        <div class="movies-grid" id="estrenos-container"></div>
    </main>

    <footer class="footer">
        <div class="container"><span>© 2026 Cines Hollywood - TPI</span></div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.14.5/sweetalert2.all.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const cont = document.getElementById('estrenos-container');
            cont.innerHTML = htmlCargando();
            try {
                const peliculas = await api('/pelicula/estrenos');
                cont.innerHTML = peliculas.length
                    ? peliculas.map(p => `
                        <article class="movie-card">
                            ${posterHTML(p, 'Próximamente')}
                            <div class="movie-card-body">
                                <h2 class="movie-card-title">${esc(p.titulo)}</h2>
                                <div class="movie-meta">
                                    ${badgeClasificacion(p.clasificacionDescripcion)}
                                    <span>${p.duracionMinutos ?? '-'} min</span>
                                </div>
                            </div>
                        </article>`).join('')
                    : htmlVacio('No hay próximos estrenos por el momento.');
            } catch (err) {
                cont.innerHTML = htmlVacio(err.message);
            }
        });
    </script>
</body>
</html>
